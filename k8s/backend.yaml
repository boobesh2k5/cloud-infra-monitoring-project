apiVersion: apps/v1
kind: Deployment
metadata:
  name: novaluxe-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novaluxe-backend
  template:
    metadata:
      labels:
        app: novaluxe-backend
    spec:
      containers:
        - name: backend
          image: 363267429195.dkr.ecr.eu-north-1.amazonaws.com/cloud-infra-monitoring-project:backend-v3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: novaluxe-db-secret
          readinessProbe:
            httpGet:
              path: /api/products
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/products
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: novaluxe-backend
spec:
  selector:
    app: novaluxe-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
